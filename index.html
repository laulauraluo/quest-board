const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(D.salt), iterations: D.rounds, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function open(key) {

}
async function tryStored() {

}
document.getElementById("f").onsubmit = async ev => {

  try {

    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(D.iv) }, key, b(D.ct)).then(() => {
