const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(D.salt), iterations: D.rounds, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function open(key) {
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(D.iv) }, key, b(D.ct));

  document.open(); document.write(html); document.close();
}
async function tryStored() {
  try { const k = localStorage.getItem("qb-key:" + D.salt); if (!k) return;

}
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault(); const e = document.getElementById("e"); e.textContent = "解锁中…";
  try {
    const key = await keyFrom(document.getElementById("p").value);
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(D.iv) }, key, b(D.ct)).then(() => {
      if (document.getElementById("r").checked) { try { localStorage.setItem("qb-key:" + D.salt, btoa(String.fromCharCode(...raw))); } catch {} }

    await open(key);
  } catch { e.textContent = "口令不对"; }
};
